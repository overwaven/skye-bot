bot_token: "123456789:ABCdefGhIJKlmnoPQRstuVWxyz_example"
# Prevent two local long-polling bot processes from using the same BOT_TOKEN.
# Set to "0" only if your deployment uses another single-instance mechanism.
telegram_polling_lock: "1"
# Keep updates that arrived while the bot was offline. Set to "1" only for an
# intentional one-time reset: Telegram will permanently discard that backlog.
telegram_drop_pending_updates: "0"
# Abort a single chat job after 3 minutes so one stuck provider call cannot
# block every later message in the same Telegram thread.
telegram_job_timeout_ms: 180000
telegram_max_attachment_bytes: 26214400 # reject Telegram files larger than 25 MiB

# Bot owner / author — surfaced in the system prompt so Skye knows who created
# her and weights their messages above other participants. Set both to empty
# strings to omit the owner section entirely.
owner:
  # Numeric Telegram user ID of the permanent primary administrator. Telegram
  # does not expose a bot creator ID. Leave 0 on first run and Skye will print
  # a one-time /claim_owner token to the operator log.
  user_id: 0
  name: ""
  tag: ""

# Access policy:
#   private      — primary owner + administrators only (safe self-host default)
#   allowlist    — administrators plus users/chats approved with /allow
#   subscription — allowlist plus active Telegram Stars subscribers
#   open         — every Telegram user; use only with deliberate spend controls
access:
  mode: "private"

# Bot administrators — Telegram user ids allowed to run /allow, /disallow,
# /ban, /unban, /allowed and to use Skye with unlimited, free access.
admin_ids: ""
# Legacy manual allow-list. On the first run after upgrade these ids are
# seeded into the admin allowlist table; after that, manage access with
# the /allow command in chat.
allowed_ids: ""

openai_key: "sk-or-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
max_completion_tokens: 500
base_url: "https://openrouter.ai/api/v1"

# Perplexity Agent API — required only if any model in the catalog above
# has provider: "perplexity". Get a key at https://console.perplexity.ai
# Skye uses the Responses API (OpenAI-compatible) to talk to Perplexity,
# enabling server-side web search and sandbox tools without MCP.
perplexity_api_key: ""
perplexity_base_url: "https://api.perplexity.ai/v1"

# xAI (Grok) API — required only if any model has provider: "xai",
# image.provider is "xai", or voice.provider is "xai" (voice may also set
# its own key under voice.xai.api_key). Get a key at https://console.x.ai
# Docs: https://docs.x.ai/developers/models
xai_api_key: ""
xai_base_url: "https://api.x.ai/v1"

# The masked model catalog exposed to users. Each entry has a display name
# (shown in the Mini App and /models), a real provider model id used for
# the upstream call, and a token-cost multiplier. The underlying model id
# is never shown to the user — only the masked name.
# `default_model_id` is the tier new subscribers start on.
#
# Optional fields per model:
#   provider:    "openrouter" (default), "perplexity", or "xai".
#                When "perplexity", the request is routed to the Perplexity
#                Agent API (requires perplexity_api_key). Perplexity models
#                use the Responses API exclusively and can enable server-side
#                tools (web_search, sandbox) on Perplexity's infrastructure.
#                When "xai", the request is routed to api.x.ai (requires
#                xai_api_key). Supports Responses + Chat Completions; works
#                with the openai_agents runtime.
#   builtin_tools: list of Perplexity built-in tools to enable.
#                "web_search"  — let the model search the web and cite sources.
#                "fetch_url"   — let the model fetch a specific URL's content.
#                "sandbox"     — let the model run code in an isolated container.
#   preset:      Perplexity preset name (e.g. "pro-search") for optimized
#                search behavior. See Perplexity docs for available presets.
default_model_id: "sydney"
models:
  - id: sydney
    name: Sydney
    model: google/gemini-3.1-flash-lite
    multiplier: 1.0
  - id: tokyo
    name: Tokyo
    model: openai/gpt-oss-20b
    multiplier: 1.5
  - id: berlin
    name: Berlin
    model: anthropic/claude-3.7-sonnet
    multiplier: 2.5
  - id: toronto
    name: Toronto
    model: openai/gpt-5.5
    multiplier: 4.0
  # Example: a Perplexity-powered tier with built-in web search + sandbox.
  # Requires perplexity_api_key below.
  # - id: perplexity-pro
  #   name: Pro Search
  #   model: openai/gpt-5.5
  #   multiplier: 5.0
  #   provider: perplexity
  #   builtin_tools:
  #     - web_search
  #     - sandbox
  #   preset: pro-search
  # Example: Grok 4.5 via xAI. Requires xai_api_key above.
  # - id: grok
  #   name: Grok
  #   model: grok-4.5
  #   multiplier: 3.0
  #   provider: xai
  #   contextWindow: 500000

# Force Chat Completions API instead of Responses API.
# Set to true if your provider doesn't support the Responses API
# (Ollama, vLLM, most self-hosted inference servers). Defaults to false.
# use_chat_completions: false

# Agent execution engine. `openai_agents` uses the OpenAI Agents SDK for the
# model/tool loop, streaming, subagents and resumable run state. Perplexity
# model entries automatically fall back to the legacy runtime.
agent_runtime:
  engine: openai_agents
  # 20 tool/model turns plus one normal final-answer turn.
  max_turns: 21
  subagent_max_turns: 8
  # Agents SDK tracing can export model and tool activity. It stays disabled
  # unless explicitly enabled; sensitive payloads remain excluded by default.
  tracing: false
  trace_include_sensitive_data: false
  # Each Telegram user can create private profiles with /create_agent. They
  # are visible only to their owner and use the currently selected chat model.
  max_user_agents: 10
  # Profiles are exposed to the active agent as delegate_<id> tools. Users can
  # also select one as the primary personality per chat/topic with /agent <id>.
  agents:
    - id: researcher
      name: Researcher
      description: Research facts, compare sources, and return evidence-backed findings.
      instructions: >-
        You are a careful research specialist. Gather the necessary evidence,
        distinguish facts from inference, and return concise findings with sources.
    - id: analyst
      name: Analyst
      description: Perform calculations, structured analysis, and verification.
      instructions: >-
        You are a rigorous analysis specialist. Use tools for calculations and
        verification, show the decisive reasoning, and check the result before returning it.

# --- Skye Plus subscription (Telegram Stars) ---
# Public users unlock Skye with a 1899 ⭐ / 30-day subscription. The base
# monthly token quota is topped up each renewal; users can buy extra token
# packs (only while subscribed) which expire when the subscription lapses.
billing:
  # Required for access.mode=subscription. Keep false for a personal bot.
  enabled: false
  currency: "XTR"
  title: "Skye Plus"
  description: "Monthly subscription — unlocks Skye and adds 2,000,000 tokens per month."
  subscription_stars: 1899
  subscription_period_seconds: 2592000 # 30 days — Bot API 8.0 requires this value
  base_quota_tokens: 2000000
  token_packs:
    - id: pack_500
      name: Quick Boost
      stars: 499
      tokens: 500000
    - id: pack_1500
      name: Big Boost
      stars: 999
      tokens: 1500000
    - id: pack_5000
      name: Mega Boost
      stars: 2499
      tokens: 5000000

# Image generation provider (used by /image and image editing).
# Independent from chat — fill these in if your chat provider doesn't support
# OpenRouter's chat-completions image modality (e.g. when base_url points to
# Ollama). If left empty, falls back to base_url/openai_key above.
#
# provider: "openrouter" (default) — POST {base_url}/images (OpenRouter-style)
# provider: "xai" — Grok Imagine via POST /images/generations and /images/edits
#   (requires xai_api_key, or image.api_key). Models:
#   grok-imagine-image-quality (recommended), see https://docs.x.ai/developers/models
# When provider is omitted, xAI is auto-detected if model starts with
# "grok-imagine" or base_url points at api.x.ai.
image:
  # provider: "xai"
  base_url: ""
  api_key: ""
  model: "google/gemini-3.1-flash-image-preview"
  # xAI-only optional knobs (ignored for OpenRouter):
  # aspect_ratio: "1:1"   # 1:1, 16:9, 9:16, auto, …
  # resolution: "1k"      # 1k | 2k

# PDF parsing — when a user sends a PDF or replies to one, Skye passes it
# to the LLM as a file input. OpenRouter-compatible providers can parse the
# PDF server-side via a "file-parser" plugin engine.
# Engines: "mistral-ocr" (best for scanned docs/images, paid per page),
#          "cloudflare-ai" (free, markdown output),
#          "native" (model must support file input natively),
#          "" (auto — uses the model's native support or defaults)
# Set to "" to disable PDF parsing entirely.
pdf_engine: ""
# Maximum PDF file size to accept (bytes, default 25 MB)
pdf_max_bytes: 26214400

# Voice (speech) provider — choose between Yandex SpeechKit, OpenRouter,
# Tinfoil, and xAI. All support STT (speech-to-text) and TTS (text-to-speech).
voice:
  # "yandex" (default), "openrouter", "tinfoil", or "xai"
  provider: "yandex"

  # Yandex Cloud SpeechKit — single Api-Key drives both STT and TTS.
  # Get one at https://aistudio.yandex.ru (Service Account → Api-Key).
  yc_api_key: ""
  yc_folder_id: ""
  # TTS voice settings (Yandex SpeechKit). Optional — sensible defaults below.
  # Voice catalogue: https://aistudio.yandex.ru/docs/ru/speechkit/tts/voices.html
  # Russian options include: jane, omazh, alena, oksana, zahar, ermil, filipp
  yc_tts_voice: "jane"
  # Emotion: neutral | good | evil | strict | friendly (voice-dependent)
  yc_tts_emotion: "neutral"
  # BCP-47 language tag — ru-RU | en-US | tr-TR | kk-KK | uz-UZ ..
  yc_tts_lang: "ru-RU"
  # Playback speed: 0.1 – 3.0 (1.0 is normal)
  yc_tts_speed: 1.0

  # OpenRouter speech (used when provider: "openrouter").
  # By default reuses openai_key/base_url above — fill in below to override.
  # STT docs: https://openrouter.ai/docs/guides/overview/multimodal/stt
  # TTS docs: https://openrouter.ai/docs/guides/overview/multimodal/tts
  openrouter:
    api_key: ""
    base_url: "https://openrouter.ai/api/v1"
    # STT model — e.g. nvidia/parakeet-tdt-0.6b-v3, openai/whisper-1
    stt_model: "nvidia/parakeet-tdt-0.6b-v3"
    # TTS model — e.g. google/gemini-3.1-flash-tts-preview, openai/gpt-4o-mini-tts
    tts_model: "google/gemini-3.1-flash-tts-preview"
    # Voice id (model-specific). Gemini supports 30 voices, including Aoede,
    # Sulafat, Achird, Kore, Puck, Charon, Enceladus, Achernar and Gacrux.
    # The send_voice tool may select any supported voice per response.
    tts_voice: "Aoede"
    # TTS response format: mp3 | pcm. Gemini TTS only supports "pcm".
    tts_format: "pcm"
    # tts_format: "mp3"
    # PCM raw stream parameters (used only when tts_format = "pcm"). OpenRouter
    # Gemini returns 24 kHz mono s16le. The response Content-Type takes
    # precedence when the provider announces a different rate.
    pcm_sample_rate: 24000
    pcm_channels: 1
    # Input format to normalize audio into before STT: mp3 | wav | oggopus
    stt_format: "mp3"
    # ISO-639-1 language hint for STT; "" = auto-detect (e.g. "ru", "en")
    stt_language: ""
    # Optional OpenRouter ranking headers
    referer: ""
    title: ""

  # Tinfoil speech — uses the OpenAI-compatible /audio/transcriptions and
  # /audio/speech endpoints on inference.tinfoil.sh. By default reuses
  # openai_key/base_url (set tinfoil.api_key / tinfoil.base_url to override).
  # Models: whisper-large-v3-turbo (STT), qwen3-tts (TTS).
  tinfoil:
    api_key: ""
    base_url: ""
    stt_model: "whisper-large-v3-turbo"
    tts_model: "qwen3-tts"
    # qwen3-tts voices: aiden, dylan, eric, ono_anna, ryan, serena, sohee, uncle_fu, vivian
    tts_voice: "vivian"
    # Hidden qwen3-tts `instruct` field: controls timbre, emotion and pace via
    # natural language. Empty string disables the instruct path.
    tts_instruct: "Speak very fast and cheerful. Bouncy, energetic young woman, smiling voice, punchy and bright. High energy, upbeat, lively delivery with no long pauses."
    stt_format: "mp3"
    stt_language: ""

  # xAI Voice API — STT (POST /v1/stt) + TTS (POST /v1/tts).
  # Used when provider: "xai". Falls back to top-level xai_api_key when
  # voice.xai.api_key is empty.
  # Docs: https://docs.x.ai/developers/model-capabilities/audio/text-to-speech
  #       https://docs.x.ai/developers/model-capabilities/audio/speech-to-text
  xai:
    api_key: ""
    base_url: "https://api.x.ai/v1"
    # Built-in voices include: eve, ara, leo, rex, sal, lumen, castor, atlas, …
    # Custom voice IDs from the xAI console also work.
    tts_voice: "eve"
    # BCP-47 language code or "auto" (required by the API).
    tts_language: "auto"
    # Speed multiplier 0.7 – 1.5
    tts_speed: 1.0
    # Output codec before OGG Opus transcoding for Telegram: mp3 | wav
    tts_format: "mp3"
    stt_format: "mp3"
    # ISO-639-1 language for STT formatting; "" = omit
    stt_language: ""

# Logging (pino)
# Levels: trace | debug | info | warn | error | fatal
log_level: "info"

# Audit log retention — two independent guards, whichever is stricter applies first
audit:
  # Keep rows for this many days (default: 90)
  retention_days: 90
  # Keep at most this many rows total (default: 100 000 ≈ ~20 MB)
  max_rows: 100000

# Durable SQLite queue for asynchronous work. Reminder delivery is persisted
# here before any LLM or Telegram request starts, so restarts are recoverable.
background_jobs:
  enabled: true
  poll_interval_ms: 1000
  lease_sec: 300
  retention_days: 7

# Reminders scheduler — checks for due reminders and delivers them via the
# background jobs queue.
reminders:
  enabled: true
  check_interval_sec: 30
  grace_sec: 300

# Connectors — managed OAuth apps through Composio plus optional custom HTTPS
# MCP endpoints. Create a project key at https://app.composio.dev/settings.
connectors:
  composio:
    # Leave blank to hide the managed app gallery.
    api_key: ""
    # Toolkit slugs enabled for every user. Configure each app's auth method in
    # Composio; some Google apps require your own OAuth credentials.
    allowed_toolkits:
      - gmail
      - googlecalendar
      - googledrive
      - github
      - notion
      - slack
    # Keeps tools tagged as destructive out of the model's tool catalog.
    disable_destructive_tools: true
  custom:
    enabled: true
    max_per_user: 8
    # Keep false on public/multi-user deployments to block SSRF into the host
    # and private infrastructure.
    allow_private_networks: false
  max_tool_output_chars: 64000

# Settings Panel (Telegram Mini App)
panel:
  # Public URL where the Mini App is accessible (set in BotFather too)
  webapp_url: "http://localhost:3001"
  # Port for the panel web server
  webapp_port: 3001
  auth_max_age_seconds: 3600
  rate_limit_window_ms: 60000
  rate_limit_max: 120
  json_body_limit_kb: 3072

# Database path. Supports ":memory:" for ephemeral storage.
db_path: "data/skye.db"

# Daytona Sandbox — isolated per-chat compute. Daytona applies the
# organization's tier-based network policy; no per-sandbox network restrictions
# are sent by Skye. Create an API key at https://app.daytona.io/dashboard/keys.
sandbox:
  enabled: true
  image: "node:24-bookworm"
  # snapshot: "skye-runtime" # optional; takes precedence over image
  cpu: 1
  memory_gib: 1
  disk_gib: 3
  auto_stop_minutes: 15
  auto_archive_minutes: 10080
  persistent: false
  command_timeout_ms: 60000
  max_output_chars: 64000
  max_file_bytes: 1000000
  daytona_api_key: ""
  # daytona_api_url: "https://app.daytona.io/api"
  # daytona_target: "us"

# Channel — let Skye manage a Telegram channel (post updates, tips, changelog).
# The bot must be added as an administrator to the channel with permission to
# post and edit messages. Skye captures every new/edited channel post into
# its database and exposes LLM tools to post, edit, and delete.
# chat_id accepts either a public @username or a numeric channel id
# (e.g. -1001234567890). When admin_only is true, only users in admin_ids
# can trigger channel tools.
channel:
  enabled: false
  chat_id: ""
  admin_only: true

# Proactive reactions — let Skye occasionally react in groups without being
# addressed directly. The model decides whether to react; these settings only
# gate how often Skye even asks.
proactive:
  enabled: true
  probability: 0.06
  warmup: 8
  min_interval_sec: 180
  context_size: 20

# Monitoring — optional log file paths for the /monitoring panel endpoint.
# Leave empty to skip log tailing.
monitoring:
  out_log: ""
  error_log: ""

# Legal — surfaced via the /terms, /privacy, /paysupport, /developer_info
# and /delete_my_data commands. Override these to point at your own hosted
# documents and support contacts. Defaults point at the Skye project pages.
legal:
  terms_url: "https://shiftlinehq.craft.me/skye-terms"
  privacy_url: "https://shiftlinehq.craft.me/skye-privacy"
  source_url: "https://github.com/ehlvg/skye-bot"
  security_url: "https://github.com/ehlvg/skye-bot/security/policy"
  support_username: "@overwaven"
  developer_name: "Sergey Gamuylo"
  developer_alias: "Erich Helvig"
  developer_email: "serg@skye-bot.com"
